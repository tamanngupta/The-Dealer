<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DealFish</title>
<style>
:root{--bg:#fbfbfd;--ink:#1d1d1f;--mut:#6e6e73;--card:#fff;--line:#d2d2d7;--blue:#0071e3;--green:#1d8a45;--red:#d70015;
--f:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#000;--ink:#f5f5f7;--mut:#a1a1a6;--card:#1c1c1e;--line:#38383a;--blue:#2997ff;--green:#32d74b;--red:#ff453a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.47 var(--f);-webkit-font-smoothing:antialiased}
nav{position:sticky;top:0;z-index:5;height:48px;display:flex;align-items:center;justify-content:center;gap:28px;font-size:13px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
nav b{font-weight:600}nav a{color:var(--mut);text-decoration:none;cursor:pointer}nav a:hover{color:var(--ink)}
.hero{max-width:820px;margin:0 auto;padding:12vh 22px 24px;text-align:center}
h1{font:700 clamp(36px,7vw,64px)/1.07 var(--f);letter-spacing:-.025em;margin:0;min-height:2.2em}
.caret{display:inline-block;width:3px;height:.9em;background:var(--blue);margin-left:4px;vertical-align:-.08em;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.sub{color:var(--mut);font-size:21px;margin:10px 0 34px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 22px;box-shadow:0 4px 30px rgba(0,0,0,.06);transition:.2s}
.search:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 20%,transparent)}
.search input{flex:1;border:0;outline:0;background:none;font:400 20px var(--f);color:var(--ink);min-width:0}
button{font:500 16px var(--f);border:0;border-radius:999px;padding:11px 22px;background:var(--blue);color:#fff;cursor:pointer;transition:.15s}
button:hover{filter:brightness(1.1)}button:disabled{opacity:.5;cursor:progress}
button.ghost{background:color-mix(in srgb,var(--mut) 15%,transparent);color:var(--ink)}
button.sm{padding:6px 14px;font-size:14px}
.opts{display:flex;gap:10px;justify-content:center;margin-top:12px}
.opts input{font:400 14px var(--f);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;width:200px;outline:0}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px;min-height:44px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:9px 18px;font-size:15px;opacity:0;transform:translateY(8px);animation:in .5s forwards}
.chip:hover{border-color:var(--blue);color:var(--blue);filter:none}
@keyframes in{to{opacity:1;transform:none}}
main{max-width:1000px;margin:0 auto;padding:0 22px 100px}
.status{text-align:center;color:var(--mut);font-size:15px;margin:26px 0 6px;min-height:24px}
.err{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red);padding:12px 16px;border-radius:14px;text-align:center;margin:16px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;margin-top:20px}
.card{background:var(--card);border-radius:22px;padding:24px;box-shadow:0 2px 20px rgba(0,0,0,.05);animation:pop .45s cubic-bezier(.2,.8,.2,1) both;position:relative;overflow:hidden}
.card.best{box-shadow:0 0 0 2px var(--green),0 8px 30px rgba(0,0,0,.08)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.store{font-weight:600;font-size:15px}
.tag{font-size:12px;font-weight:600;color:#fff;background:var(--green);padding:3px 10px;border-radius:99px}
.pt{color:var(--mut);font-size:14px;margin:4px 0 14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font:700 40px/1.1 var(--f);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.price small{display:block;font:400 13px var(--f);color:var(--mut);letter-spacing:0;margin-bottom:2px}
.rows{margin:14px 0 0;font-size:14px;color:var(--mut)}.rows div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-top:1px solid var(--line)}
.rows .m span:last-child{color:var(--green);font-weight:600}
.v{margin-top:12px;font-size:13px;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--mut) 12%,transparent)}
.v.real{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}.v.fake{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red)}
.fine{color:var(--mut);font-size:12px;margin:10px 0 0}
.go{display:inline-block;margin-top:12px;color:var(--blue);text-decoration:none;font-size:15px}.go:hover{text-decoration:underline}
.live{display:flex;align-items:center;gap:8px;color:var(--blue);font-size:14px;margin-top:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.8);opacity:.3}}
.shim{height:12px;border-radius:6px;margin-top:12px;background:linear-gradient(90deg,color-mix(in srgb,var(--mut) 10%,transparent),color-mix(in srgb,var(--mut) 25%,transparent),color-mix(in srgb,var(--mut) 10%,transparent));background-size:200%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200%}}
.rough{font-size:13px;color:var(--mut);margin-top:8px}
h2{font:700 32px var(--f);letter-spacing:-.02em;text-align:center;margin:80px 0 20px}
.watch{background:var(--card);border-radius:22px;padding:22px;margin-top:20px;text-align:center}
.item{background:var(--card);border-radius:18px;padding:18px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.item b{font-weight:600}.mut{color:var(--mut);font-size:14px}.hit{color:var(--green);font-weight:600}
.alert{background:var(--green);color:#fff;border-radius:18px;padding:14px 18px;margin-top:12px}.alert a{color:#fff;font-weight:600}
.wrow{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.wrow input{font:400 16px var(--f);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 12px;width:120px}
</style>
</head>
<body>
<nav><b>DealFish</b><a onclick="scrollTo({top:0,behavior:'smooth'})">Search</a><a onclick="document.getElementById('wl').scrollIntoView({behavior:'smooth'})">Want to buy</a></nav>
<section class="hero">
  <h1><span id="tw"></span><span class="caret"></span></h1>
  <p class="sub">We open every shop, read the offers, and tell you what you'll really pay.</p>
  <div class="search">
    <input id="q" type="text" placeholder="What do you want to buy?" autocomplete="off" aria-label="Product to buy" autofocus>
    <button id="go">Find best price</button>
  </div>
  <div class="opts">
    <input id="bank" placeholder="Your card, e.g. HDFC (optional)">
    <input id="pin" placeholder="Pincode (optional)" inputmode="numeric" maxlength="6" style="width:150px">
  </div>
  <div class="chips" id="chips"></div>
</section>
<main>
  <div class="status" id="status" aria-live="polite"></div>
  <div id="err"></div>
  <div class="grid" id="cards"></div>
  <div id="watchbox"></div>
  <h2 id="wl">Want to buy</h2>
  <div id="alerts"></div><div id="list"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const inr=n=>"₹"+Math.round(n).toLocaleString("en-IN");
const safe=u=>{try{return["http:","https:"].includes(new URL(u).protocol)?u:"#"}catch{return"#"}};
function el(t,p={},...k){const n=document.createElement(t);for(const[a,v]of Object.entries(p)){if(a==="class")n.className=v;else if(a==="text")n.textContent=v;else if(a.startsWith("on"))n.addEventListener(a.slice(2),v);else n.setAttribute(a,v)}for(const x of k.flat())if(x)n.append(x);return n}
async function api(p,o){const r=await fetch(p,o&&{...o,headers:{"Content-Type":"application/json"}});const j=await r.json();if(!r.ok)throw new Error(j.error||"Something went wrong");return j}

// ---- typewriter headline ----
const lines=["What are you buying today?","Find the real price.","Skip the fake discounts.","Ask. We'll check every shop."];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let typing=true;
(async()=>{let i=0;while(typing){const s=lines[i++%lines.length];for(let c=1;c<=s.length&&typing;c++){$("tw").textContent=s.slice(0,c);await sleep(55)}
if(!typing)break;await sleep(1700);for(let c=s.length;c>=0&&typing;c--){$("tw").textContent=s.slice(0,c);await sleep(22)}await sleep(300)}})();

// ---- suggestions ----
const ideas=["iPhone 16","Sony WH-1000XM5","Logitech MX Keys","Samsung 55\" 4K TV","Nike Pegasus 41","Kindle Paperwhite","boAt Airdopes 141","Dyson hair dryer"];
ideas.forEach((t,i)=>{const b=el("button",{class:"chip",text:t,style:`animation-delay:${.8+i*.12}s`,onclick:()=>{$("q").value=t;search()}});$("chips").append(b)});

let lq="",lb="",lp="",lbest=null;
function showErr(m){$("err").replaceChildren(m?el("div",{class:"err",text:m,role:"alert"}):"")}

async function search(){
  const query=$("q").value.trim();
  if(query.length<3){showErr("Type what you want to buy first.");return}
  typing=false;$("tw").textContent=query;
  lq=query;lb=$("bank").value.trim();lp=$("pin").value.trim();
  $("go").disabled=true;$("cards").replaceChildren();$("watchbox").replaceChildren();showErr("");
  $("status").textContent="Searching the web…";
  $("status").scrollIntoView({behavior:"smooth",block:"center"});
  const cache=new Map();
  try{
    const{jobId}=await api("/api/search",{method:"POST",body:JSON.stringify({query,bank:lb,pincode:lp})});
    for(;;){
      await sleep(600);
      const job=await api("/api/jobs/"+jobId);
      const last=job.steps[job.steps.length-1];if(last)$("status").textContent=last.text;
      const cs=Object.values(job.cards||{});
      cs.forEach(c=>{const sig=JSON.stringify(c);if(cache.get(c.key)===sig)return;cache.set(c.key,sig);
        const n=card(c,false);const old=document.querySelector(`[data-k="${CSS.escape(c.key)}"]`);n.dataset.k=c.key;
        if(old){n.style.animation="none";old.replaceWith(n)}else $("cards").append(n)});
      if(job.status==="done"){finish(job.result);break}
      if(job.status==="error"){showErr(job.error);$("status").textContent="";break}
    }
  }catch(e){showErr(e.message);$("status").textContent=""}
  $("go").disabled=false;
}

function finish({cards,best}){
  lbest=best;$("status").textContent=best?"Done. Here's the lowest you'll pay.":"Done.";
  if(best){const n=card(best,true);n.style.animation="none";n.dataset.k=best.key;
    const old=document.querySelector(`[data-k="${CSS.escape(best.key)}"]`);old&&old.replaceWith(n);
    const t=el("input",{type:"text",inputmode:"numeric",value:String(Math.round(best.effective*.9)),"aria-label":"Target price"});
    $("watchbox").replaceChildren(el("div",{class:"watch"},el("h3",{text:"Not today? Watch it.",style:"margin:0 0 12px;font-weight:600"}),
      el("div",{class:"wrow"},el("span",{text:"Tell me when it hits ₹"}),t,el("button",{class:"sm",text:"Watch this",onclick:()=>addWatch(t.value)}))))}
}

function card(c,best){
  const top=el("div",{class:"top"},el("span",{class:"store",text:c.store}),best?el("span",{class:"tag",text:"Lowest"}):"");
  if(c.state==="reading"||!c.state)return el("article",{class:"card"},top,
    el("div",{class:"pt",text:c.title||""}),
    el("div",{class:"live"},el("span",{class:"dot"}),el("span",{text:"TinyFish is on this site…"})),
    c.roughPrice?el("div",{class:"price"},el("small",{text:"Listed price (checking offers…)"}),inr(c.roughPrice)):"",
    el("div",{class:"shim",style:"width:70%"}),el("div",{class:"shim",style:"width:45%"}));
  if(!c.ok)return el("article",{class:"card"},top,el("div",{class:"pt",text:c.title||""}),
    el("p",{text:"Couldn't read this shop: "+c.error,style:"margin:0;font-size:14px"}),
    c.roughPrice?el("p",{class:"fine",text:`Quick read showed ~${inr(c.roughPrice)}. Unverified, offers not read.`}):"",
    el("a",{class:"go",href:safe(c.url),target:"_blank",rel:"noopener noreferrer",text:"Open the page ›"}));
  const rows=[el("div",{},el("span",{text:"Sticker price"}),el("span",{text:inr(c.price)}))];
  if(c.bankOffer)rows.push(el("div",{class:"m"},el("span",{text:c.bankOffer.text.slice(0,48)}),el("span",{text:"− "+inr(c.bankOffer.value)})));
  if(c.coupon)rows.push(el("div",{class:"m"},el("span",{text:c.coupon.text.slice(0,48)}),el("span",{text:"− "+inr(c.coupon.value)})));
  return el("article",{class:"card"+(best?" best":"")},top,
    el("div",{class:"pt",text:c.product||c.title||""}),
    el("div",{class:"price"},el("small",{text:c.rough?"Listed price":"You pay about"}),inr(c.effective)),
    el("div",{class:"rows"},...rows),
    c.cashback?el("p",{class:"fine",text:`+ ${inr(c.cashback.value)} cashback later`}):"",
    el("div",{class:"v "+c.verdict.level,text:c.verdict.text}),
    el("p",{class:"fine",text:[c.inStock===false?"Out of stock.":"",c.delivery||"","Offers may not stack. Verify at checkout."].filter(Boolean).join(" ")}),
    el("a",{class:"go",href:safe(c.url),target:"_blank",rel:"noopener noreferrer",text:"Buy on "+c.store+" ›"}));
}

async function addWatch(t){try{await api("/api/watchlist",{method:"POST",body:JSON.stringify({query:lq,target:t,bank:lb,pincode:lp,seedPrice:lbest?.effective,seedStore:lbest?.store,seedUrl:lbest?.url})});
  $("watchbox").replaceChildren(el("div",{class:"watch",text:"On your list. We'll flag it below when it drops."}));loadList()}catch(e){showErr(e.message)}}

async function loadList(){try{const{items,alerts}=await api("/api/watchlist");
  $("alerts").replaceChildren(...alerts.filter(a=>!a.seen).map(a=>el("div",{class:"alert"},el("div",{text:`${a.query} hit ${inr(a.price)} on ${a.store} (target ${inr(a.target)})`}),
    el("a",{href:safe(a.url),target:"_blank",rel:"noopener noreferrer",text:"Open it › "}),el("button",{class:"sm ghost",text:"Got it",onclick:async()=>{await api("/api/alerts/seen",{method:"POST",body:"{}"});loadList()}}))));
  $("list").replaceChildren(...(items.length?items.map(it=>el("div",{class:"item"},
    el("div",{},el("b",{text:it.query}),el("div",{class:"mut",text:`Target ${inr(it.target)}`+(it.best?` · now ${inr(it.best.price)} at ${it.best.store}`:"")})),
    el("div",{},el("button",{class:"sm ghost",text:"Check now",onclick:async e=>{e.target.disabled=true;e.target.textContent="Checking…";try{await api(`/api/watchlist/${it.id}/check`,{method:"POST",body:"{}"})}catch(er){showErr(er.message)}loadList()}})," ",
      el("button",{class:"sm ghost",text:"Remove",onclick:async()=>{await api("/api/watchlist/"+it.id,{method:"DELETE"});loadList()}})))):[el("p",{class:"mut",text:"Nothing yet. Search, then tap Watch this.",style:"text-align:center"})]))}catch{}}

$("go").addEventListener("click",search);
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")search()});
loadList();setInterval(loadList,30000);
</script>
</body>
</html>
